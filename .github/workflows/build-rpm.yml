name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install packaging tools
        run: |
          sudo apt-get install -y rpm
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build release + packages (.deb / .rpm / .AppImage / tarball)
        run: ./scripts/package.sh all

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caw-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    # Windows is a best-effort target: a failure here must not block Linux
    # release artifacts.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/caw.exe dist/caw.exe
          Compress-Archive -Path dist/caw.exe -DestinationPath dist/caw-windows-x86_64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caw-windows
          path: dist/caw-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: caw-*
          merge-multiple: true
          path: bundles

      - name: Attach bundles to Release
        run: |
          set -euo pipefail
          ls -la bundles/
          gh release create "${{ github.ref_name }}" --latest --title "${{ github.ref_name }}" --generate-notes || true
          find bundles -type f -exec gh release upload "${{ github.ref_name }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
