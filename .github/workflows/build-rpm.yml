name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          set -euo pipefail
          strip target/release/caw
          mkdir -p dist/caw-linux-x86_64
          cp target/release/caw dist/caw-linux-x86_64/
          cp README.md PLAN.md dist/caw-linux-x86_64/
          cp assets/icons/music.svg dist/caw-linux-x86_64/caw.svg
          tar -C dist -czf dist/caw-linux-x86_64.tar.gz caw-linux-x86_64
          sha256sum dist/caw-linux-x86_64.tar.gz > dist/caw-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caw-linux
          path: dist/caw-linux-x86_64.tar.gz*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/caw.exe dist/caw.exe
          Compress-Archive -Path dist/caw.exe -DestinationPath dist/caw-windows-x86_64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caw-windows
          path: dist/caw-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: caw-*
          merge-multiple: true
          path: bundles

      - name: Attach bundles to Release
        run: |
          set -euo pipefail
          ls -la bundles/
          gh release create "${{ github.ref_name }}" --latest --title "${{ github.ref_name }}" --generate-notes || true
          find bundles -type f -exec gh release upload "${{ github.ref_name }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
