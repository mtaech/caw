[package]
name = "caw"
version = "0.4.0"
edition = "2024"

[dependencies]
gpui-kit = "0.7.0"

# Audio decoding
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }

# Audio output (Linux: ALSA backend -> PipeWire)
cpal = "0.18"

# Database for playlists and settings
rusqlite = { version = "0.32", features = ["bundled"] }

# Utilities
crossbeam-channel = "0.5"
walkdir = "2"
dirs = "5"
image = "0.25"
encoding_rs = "0.8"
anyhow = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
rust-embed = "8"
smol = "2"

# Linux platform integration (MPRIS / desktop media keys).
# zbus 5 is already in the lockfile transitively; the direct dependency lets us
# expose org.mpris.MediaPlayer2 without pulling GPUI types into the platform code.
# NOTE: the tray (ksni 0.3.7) is deferred because it does not compile against
# zbus 5.19; see PLAN.md.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

[profile.dev.package."*"]
opt-level = 3
